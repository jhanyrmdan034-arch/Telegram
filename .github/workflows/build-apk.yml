name: Build custom-backend APK

# Builds the Telegram-Android fork (this repo) as a signed APK wired to YOUR
# MTProto backend (server/mtserver) instead of Telegram's datacenters.
#
# Trigger manually with your server address:
#   gh workflow run build-apk.yml --ref arena/b6bc4d23-telegram \
#       -f backend_host=YOUR_SERVER_IP_OR_DOMAIN -f backend_port=8443
#
# Then download the artifact:  gh run download <run-id> -n app-afat-release
#
# The app embeds the RSA public key of server/dev_server_key.pem, so run the
# server with:  python3 -m mtserver.main --key server/dev_server_key.pem ...

on:
  workflow_dispatch:
    inputs:
      backend_host:
        description: 'Backend server IP or domain the app should dial'
        required: true
        default: '127.0.0.1'
      backend_port:
        description: 'Backend server port'
        required: false
        default: '8443'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android-sdk@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Generate CustomBackendConfig.h (custom backend endpoint + RSA key)
        run: |
          python3 server/gen_client_config.py \
            --public-host "${{ inputs.backend_host }}" \
            --public-port "${{ inputs.backend_port }}" \
            --key server/dev_server_key.pem \
            > TMessagesProj/jni/tgnet/CustomBackendConfig.h
          head -8 TMessagesProj/jni/tgnet/CustomBackendConfig.h

      - name: Build APK (afat release, signed with the dummy repo keystore)
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-afat-release-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          retention-days: 7
