name: Build Telegram APK

on:
  push:
    branches: ['arena/42f78b0d-telegram']
    paths: ['.github/workflows/build-apk.yml']
  workflow_dispatch:
    inputs:
      abi:
        description: 'Which APK(s) to build'
        default: 'both'
        type: choice
        options: ['both', 'arm64', 'universal']

permissions:
  contents: write

env:
  APP_VERSION: 13.1.1

jobs:
  build:
    name: Build ${{ matrix.abi }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.abi == 'arm64' && '["arm64"]' || inputs.abi == 'universal' && '["universal"]' || '["arm64", "universal"]') }}
    steps:
      - name: Free disk space + add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/share/powershell /opt/az 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h
          free -h

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Init submodules (shallow)
        run: |
          git config --global protocol.version 2
          git submodule update --init --recursive --depth=1 --jobs=8
          echo "--- submodule status ---"
          git submodule status | head -40
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages (API 36, NDK, CMake)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools"
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -2
          df -h

      - name: Restrict to arm64 (faster build)
        if: matrix.abi == 'arm64'
        run: |
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/' TMessagesProj_App/build.gradle
          grep -n "abiFilters" TMessagesProj_App/build.gradle

      - name: Use separate package name (install alongside official app)
        run: |
          NEW_PKG="org.telegram.messenger.fork"
          echo "NEW_PKG=$NEW_PKG"
          sed -i "s/^APP_PACKAGE=.*/APP_PACKAGE=$NEW_PKG/" gradle.properties
          grep "^APP_PACKAGE=" gradle.properties
          NEW_PKG="$NEW_PKG" python3 - <<'PYEOF'
          import json, os
          p = 'TMessagesProj/google-services.json'
          with open(p) as f:
              d = json.load(f)
          new_pkg = os.environ['NEW_PKG']
          if all(c['client_info']['android_client_info']['package_name'] != new_pkg for c in d['client']):
              client = json.loads(json.dumps(d['client'][0]))
              client['client_info']['android_client_info']['package_name'] = new_pkg
              d['client'].append(client)
              with open(p, 'w') as f:
                  json.dump(d, f, indent=2)
                  f.write('\n')
          print([c['client_info']['android_client_info']['package_name'] for c in d['client']])
          PYEOF
          grep -rl 'name="AppName"' TMessagesProj/src/main/res/ | xargs sed -i 's|\(<string name="AppName"[^>]*>\)[^<]*|\1Telegram 2|'
          echo "--- AppName values ---"
          grep -rh 'name="AppName"' TMessagesProj/src/main/res/ | sort -u

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import re
          try:
              log = open('build.log', errors='replace').read()
          except FileNotFoundError:
              print('::error::build.log not found')
              raise SystemExit
          def emit(msg):
              msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + msg[:6000])
          m = re.search(r'\* What went wrong:(.*?)(?=\n\* Try:|\Z)', log, re.S)
          if m:
              emit('GRADLE FAILURE:' + m.group(1)[:6000])
          failed = [l for l in log.splitlines() if 'FAILED' in l or l.startswith('e: ')]
          if failed:
              emit('FAILED LINES:\n' + '\n'.join(failed[:40]))
          tail = '\n'.join(log.splitlines()[-60:])
          emit('LOG TAIL:\n' + tail)
          PYEOF

      - name: Collect APK
        run: |
          ls -lh TMessagesProj_App/build/outputs/apk/afat/release/
          cp TMessagesProj_App/build/outputs/apk/afat/release/app.apk "Telegram-${{ env.APP_VERSION }}-${{ matrix.abi }}.apk"
          sha256sum "Telegram-${{ env.APP_VERSION }}-${{ matrix.abi }}.apk" | tee "Telegram-${{ env.APP_VERSION }}-${{ matrix.abi }}.apk.sha256"
          ls -lh Telegram-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-apk-${{ matrix.abi }}
          path: Telegram-*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.APP_VERSION }}-${{ matrix.abi }}-${{ github.run_number }}
          name: Telegram ${{ env.APP_VERSION }} APK (${{ matrix.abi }})
          body: |
            Unofficial build of Telegram for Android v${{ env.APP_VERSION }} compiled from source.
            بیلد غیررسمی تلگرام اندروید نسخه ${{ env.APP_VERSION }} کامپایل‌شده از سورس.

            **Which file should I download? / کدام فایل را دانلود کنم؟**
            - `Telegram-${{ env.APP_VERSION }}-arm64.apk` — for almost all modern phones (64-bit). / برای اکثر گوشی‌های جدید (۶۴ بیتی).
            - `Telegram-${{ env.APP_VERSION }}-universal.apk` — works on every device (ARM 32/64-bit, x86). / برای همه دستگاه‌ها.

            This build uses its own package name, so it installs **alongside** the official Telegram as a separate app called **"Telegram 2"** — no need to uninstall anything.
            این نسخه پکیج‌نیم جداگانه دارد و **کنار** تلگرام رسمی با نام **«Telegram 2»** نصب می‌شود — نیازی به حذف چیزی نیست.

            **Install / نصب:**
            1. Download the APK on your phone, open it and allow "Install unknown apps" if asked. / فایل را در گوشی دانلود و باز کنید و در صورت نیاز اجازه «نصب برنامه‌های ناشناس» را بدهید.
            2. Log in with your phone number (you can use a different account than your main Telegram). / با شماره موبایل وارد شوید (می‌توانید اکانت متفاوتی از تلگرام اصلی داشته باشید).

            SHA-256 checksum is in the `.sha256` file. / کد صحت فایل در فایل `.sha256` است.
          files: Telegram-*
          prerelease: true
