name: Android verify

# Real toolchain verification for the platform client: the development sandbox
# has no JDK or Android SDK, so compilation is proven here, on a runner that does.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/76249c66-telegram
    paths:
      - ".github/workflows/android-verify.yml"
      - "TMessagesProj/src/main/java/org/telegram/platform/**"
      - "TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java"
      - "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
      - "TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java"
      - "TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java"

jobs:
  compile:
    name: Compile debug sources
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Report toolchain
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed | head -20

      # Java compilation of the whole app module. This is the step that proves the
      # platform client and the patched ConnectionsManager actually compile.
      - name: Compile Java sources (:TMessagesProj:compileDebugJavaWithJavac)
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj:compileDebugJavaWithJavac 2>&1 | tee compile.log

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile.log
          if-no-files-found: ignore

      # Full APK. Needs the native toolchain and the git submodules, which a plain
      # checkout does not provide, so a failure here is reported, not hidden.
      - name: Build debug APK (best effort)
        id: apk
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj:assembleDebug 2>&1 | tee assemble.log

      - name: Upload APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload assemble log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-log
          path: assemble.log
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android verification"
            echo ""
            echo "- Java compile: see the job log"
            echo "- APK build outcome: ${{ steps.apk.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
